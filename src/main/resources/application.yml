spring:
  application:
    name: crud-pessoa
  datasource:
    url: jdbc:mysql://localhost:3306/pessoa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: true
    open-in-view: false
javers:
  mappingStyle: field
  algorithm: simple
  commitIdGenerator: synchronized_sequence
  springDataAuditableRepositoryAspectEnabled: true