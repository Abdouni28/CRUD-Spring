services:

  mysql:
    image: mysql:8.0
    container_name: pessoa-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pessoa
    ports:
      - "3306:3306"
    volumes:
      - db_volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    container_name: pessoa-java-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: pessoa
      DB_USER: root
      DB_PASS: root

networks:
  app-network:

volumes:
  db_volume: